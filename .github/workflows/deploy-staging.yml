name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-staging
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Firebase staging
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: reading-staging
      url: ${{ vars.SCHOOL_SITE_ORIGIN }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_ENV: staging
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.FIREBASE_APP_CHECK_SITE_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
      SCHOOL_CODE: ${{ vars.SCHOOL_CODE }}
      SCHOOL_GITHUB_ORG: ${{ vars.SCHOOL_GITHUB_ORG }}
      SCHOOL_NAME: ${{ vars.SCHOOL_NAME }}
      SCHOOL_SITE_ORIGIN: ${{ vars.SCHOOL_SITE_ORIGIN }}
      SCHOOL_YEAR: ${{ vars.SCHOOL_YEAR }}
    steps:
      - name: Check out protected staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts
          npm --prefix admin-tools ci --ignore-scripts

      - name: Enforce school ownership and protected branch
        run: npm run verify:deployment

      - name: Rebuild analytics on top of current staging staff UI
        run: |
          node scripts/build-current-staging.mjs "$FIREBASE_PROJECT_ID"
          npm run configure:firebase

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Backfill librarian trend analytics once
        run: node admin-tools/backfill-librarian-analytics.mjs --project "$FIREBASE_PROJECT_ID" --school-year "$SCHOOL_YEAR"

      - name: Deploy analytics UI and submitReadingLog only
        run: ./node_modules/.bin/firebase deploy --project "$FIREBASE_PROJECT_ID" --only "hosting:reading,functions:submitReadingLog" --non-interactive
