name: Quality gate

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts
          npm --prefix admin-tools ci --ignore-scripts

      - name: Block high or critical dependency advisories
        run: |
          npm audit --audit-level=high
          npm --prefix functions audit --audit-level=high
          npm --prefix admin-tools audit --audit-level=high

      - name: Check JavaScript syntax
        run: npm run check:source

      - name: Test release contract and trusted tools
        run: |
          npm run test:release
          npm --prefix functions test
          npm --prefix admin-tools test

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Test Firestore allow and deny rules
        run: npm run test:rules

      - name: Build allowlisted school site
        env: &ci-build-env
          DEPLOYMENT_ENV: ci
          FIREBASE_API_KEY: AIzaSyCITestOnly0000000000000000000000
          FIREBASE_APP_CHECK_SITE_KEY: 6LcCITestOnly00000000000000000000000000
          FIREBASE_APP_ID: 1:123456789012:web:0123456789abcdef
          FIREBASE_AUTH_DOMAIN: school-reading-ci.firebaseapp.com
          FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          FIREBASE_PROJECT_ID: school-reading-ci
          FIREBASE_STORAGE_BUCKET: school-reading-ci.firebasestorage.app
          SCHOOL_CODE: scysps-ci
          SCHOOL_NAME: Reading Run CI School
          SCHOOL_SITE_ORIGIN: https://reading-ci.example.edu.hk
          SCHOOL_YEAR: 2026-2027
        run: npm run build

      - name: Validate deployment artifact and headers
        env: *ci-build-env
        run: npm run validate:dist
